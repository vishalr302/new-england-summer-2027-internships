name: Update internships
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internship-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m src.main
      - name: Commit changed listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/jobs.json data/jobs.csv data/source_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update internship listings"
            git push
          fi
      - name: Preserve source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health
          path: data/source_status.json
